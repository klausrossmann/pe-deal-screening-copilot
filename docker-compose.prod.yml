services:
  api:
    build: .
    container_name: pe-screening-api
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/analysis:/app/data/analysis
    restart: unless-stopped

  ui:
    build: .
    container_name: pe-screening-ui
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    command: streamlit run app/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
